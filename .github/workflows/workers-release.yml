name: Workers release

on:
  push:
    tags: ['v*-workers']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "const version = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + version + '-workers') throw new Error('Workers tag does not match package.json')"
      - name: Verify the release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: node --check telegram_webproxy.js
      - run: npm test
      - run: npm run test:runtime
      - run: node --expose-gc benchmarks/transport.mjs --quick --sizes --verify --tcp --tcp-baseline --against=b5835145b157f22691b671470856d0d37f07316e
      - run: node benchmarks/startup.mjs --quick --against=b5835145b157f22691b671470856d0d37f07316e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: workers-package
          if-no-files-found: error
          path: |
            dist/workers/Workers.zip
            dist/workers/telegram_webproxy.js
            dist/workers/SHA256SUMS.txt
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workers-package
          path: dist
      - run: sha256sum --check SHA256SUMS.txt
        working-directory: dist
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/Workers.zip dist/telegram_webproxy.js dist/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
