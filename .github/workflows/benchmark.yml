name: Transport benchmark

on:
  push:
    branches: [main]
    tags: ['v*', '!v*-workers']
    paths: [telegram_webproxy.js, 'benchmarks/**', 'experiments/tcp.mjs', tests/fixtures.js]
  pull_request:
    paths: [telegram_webproxy.js, 'benchmarks/**', 'experiments/tcp.mjs', tests/fixtures.js]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BENCHMARK_BASELINE: 59aeb06b19ed24b90555ce3d88de668410e0ebb5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: |
          npm run bench -- --tcp --against="$BENCHMARK_BASELINE"
          npm run bench:startup -- --against="$BENCHMARK_BASELINE"
      - if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          npm run bench -- --quick --tcp --against="$BENCHMARK_BASELINE"
          npm run bench:startup -- --quick --against="$BENCHMARK_BASELINE"
