name: Transport benchmark

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: [telegram_webproxy.js, 'benchmarks/**', tests/fixtures.js]
  pull_request:
    paths: [telegram_webproxy.js, 'benchmarks/**', tests/fixtures.js]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BENCHMARK_BASELINE: 9bae14677f663670fceed2e007b6b3d6b4347368
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: |
          npm run bench -- --against="$BENCHMARK_BASELINE"
          npm run bench:startup -- --against="$BENCHMARK_BASELINE"
      - if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          npm run bench -- --quick --against="$BENCHMARK_BASELINE"
          npm run bench:startup -- --quick --against="$BENCHMARK_BASELINE"
