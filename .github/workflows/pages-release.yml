name: Pages package

on:
  pull_request:
  push:
    tags: ['v*-pages.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:runtime
      - run: node --check dist/verified/_worker.js
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pages-package
          if-no-files-found: error
          path: |
            dist/Pages.zip
            dist/SHA256SUMS.txt

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pages-package
          path: dist
      - run: sha256sum --check SHA256SUMS.txt
        working-directory: dist
      - run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}" dist/Pages.zip dist/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
